name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://servee:servee@localhost:5432/servee?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - name: Typecheck contracts
        run: pnpm --filter @servee/contracts typecheck
      - name: Typecheck UI
        run: pnpm --filter @servee/ui typecheck
      - name: Validate database
        run: pnpm --filter @servee/database typecheck
      - name: Typecheck API
        run: pnpm --filter @servee/api typecheck
      - name: Typecheck guest
        run: pnpm --filter @servee/guest typecheck
      - run: pnpm build
